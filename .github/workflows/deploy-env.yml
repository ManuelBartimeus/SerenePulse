name: deploy-env

# One environment's deploy: migrations, Edge Functions, both Workers, smoke test.
# Called by deploy.yml; never triggered directly.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.113.0
      - run: pnpm install --frozen-lockfile

      - name: Database migrations (forward-only)
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push --include-all

      - name: Edge Functions
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          else
            echo "No Edge Functions yet."
          fi

      - name: Build portal
        run: pnpm --filter @serene/portal build
        env:
          VITE_APP_ENV: ${{ env.TARGET }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_PORTAL }}

      - name: No secret keys in any built bundle
        run: pnpm scan:bundles

      - name: Deploy survey Worker
        working-directory: apps/survey-worker
        run: >-
          pnpm exec wrangler deploy --env "$TARGET"
          --var "GIT_SHA:${GITHUB_SHA::12}"
          --var "SUPABASE_URL:${{ vars.SUPABASE_URL }}"
          --var "TURNSTILE_SITE_KEY:${{ vars.TURNSTILE_SITE_KEY }}"
          --var "CF_WEB_ANALYTICS_TOKEN:${{ vars.CF_WEB_ANALYTICS_TOKEN }}"

      - name: Deploy portal
        working-directory: apps/portal
        run: pnpm exec wrangler deploy --env "$TARGET"

      - name: Smoke test
        run: |
          test -n "${{ vars.WORKERS_SUBDOMAIN }}" || { echo "WORKERS_SUBDOMAIN repository variable is not set"; exit 1; }
          worker=$([ "$TARGET" = production ] && echo "serene-pulse-survey" || echo "serene-pulse-survey-staging")
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' "https://$worker.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev/healthz" || true)
            [ "$code" = 200 ] && { cat /tmp/h.json; exit 0; }
            sleep 10
          done
          echo "healthz did not return 200 (last: $code)"; cat /tmp/h.json || true; exit 1

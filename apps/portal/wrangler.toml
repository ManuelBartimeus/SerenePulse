# Portal (cx.<domain>): a static-assets-only Worker (A-146). No secrets: the bundle holds
# only the Supabase URL and the public anon/publishable key.
name = "serene-pulse-portal-local"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.staging]
name = "serene-pulse-portal-staging"
routes = [{ pattern = "cx-staging.__ROOT_DOMAIN__", custom_domain = true }]

[env.production]
name = "serene-pulse-portal"
routes = [{ pattern = "cx.__ROOT_DOMAIN__", custom_domain = true }]

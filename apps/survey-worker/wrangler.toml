# Survey Worker. Hosted on Cloudflare's workers.dev subdomain (D-37):
#   staging     https://serene-pulse-survey-staging.<subdomain>.workers.dev
#   production  https://serene-pulse-survey.<subdomain>.workers.dev
# Secrets are NOT here: `node scripts/sync-secrets.mjs worker <env>` loads them
# (SUPABASE_SERVICE_ROLE_KEY, SURVEY_HMAC_KEY, TURNSTILE_SECRET_KEY, SENTRY_DSN).
# Local development reads .dev.vars (git-ignored), from `node scripts/sync-secrets.mjs local`.
name = "serene-pulse-survey-local"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[vars]
APP_ENV = "local"

# Daily keep-alive at 06:00 Africa/Accra (UTC+0): stops the free Supabase project pausing.
[env.staging]
name = "serene-pulse-survey-staging"
workers_dev = true
preview_urls = false
triggers = { crons = ["0 6 * * *"] }
vars = { APP_ENV = "staging" }

[env.production]
name = "serene-pulse-survey"
workers_dev = true
preview_urls = false
triggers = { crons = ["0 6 * * *"] }
vars = { APP_ENV = "production" }

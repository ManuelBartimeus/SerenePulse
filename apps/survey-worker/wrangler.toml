# Survey Worker (feedback.<domain>). Secrets are NOT here: `pnpm secrets:sync` loads them
# (SUPABASE_SERVICE_ROLE_KEY, SURVEY_HMAC_KEY, TURNSTILE_SECRET_KEY, SENTRY_DSN).
# Local development reads .dev.vars (git-ignored), generated by the same script.
name = "serene-pulse-survey-local"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[vars]
APP_ENV = "local"

# Daily keep-alive at 06:00 Africa/Accra (UTC+0): stops the free Supabase project pausing.
# __ROOT_DOMAIN__ is substituted by deploy.yml from the SERENE_ROOT_DOMAIN repository variable.
[env.staging]
name = "serene-pulse-survey-staging"
routes = [{ pattern = "feedback-staging.__ROOT_DOMAIN__", custom_domain = true }]
triggers = { crons = ["0 6 * * *"] }
vars = { APP_ENV = "staging" }

[env.production]
name = "serene-pulse-survey"
routes = [{ pattern = "feedback.__ROOT_DOMAIN__", custom_domain = true }]
triggers = { crons = ["0 6 * * *"] }
vars = { APP_ENV = "production" }

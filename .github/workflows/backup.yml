name: backup

# Nightly encrypted logical backup of PRODUCTION (SPEC DISASTER RECOVERY, D-41).
# 02:00 UTC = 02:00 Africa/Accra. Stored as GitHub Actions artifacts (no R2):
#   daily copies kept 35 days; the copy made on the 1st of each month kept 90 days
#   (GitHub's maximum, so monthly history is 3 months rather than SPEC's 12; see ADR-0008).
# Encrypted to Nii's age public key; the private key never enters CI (ADR-0007).
# A failed run emails the repository owner (GitHub Actions notifications).
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age

      - name: Dump and encrypt
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$AGE_RECIPIENT" || { echo "BACKUP_AGE_PUBLIC_KEY variable is not set"; exit 1; }
          file="serene-pulse-$(date -u +%F).dump.age"
          # Data only, for our schemas plus auth (staff accounts). The schema itself comes from
          # supabase/migrations at restore time: Supabase-managed objects can't be recreated by a
          # normal role, so a whole-database dump is not restorable. Vault secrets are reloaded
          # with scripts/sync-secrets.mjs (they are encrypted with a per-project key).
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --data-only --load-via-partition-root \
            --schema=public --schema=app --schema=survey --schema=analytics --schema=pii \
            --schema=audit --schema=ops --schema=auth --exclude-table-data='auth.schema_migrations' \
            --dbname="$DB_URL" --file=backup.dump
          # Refuse to store a dump that doesn't contain the tables a restore depends on.
          toc=$(/usr/lib/postgresql/17/bin/pg_restore --list backup.dump)
          for t in 'TABLE DATA public settings' 'TABLE DATA audit log' 'TABLE DATA auth users'; do
            grep -q "$t" <<<"$toc" || { echo "Backup is missing: $t"; exit 1; }
          done
          age -r "$AGE_RECIPIENT" -o "$file" backup.dump
          rm -f backup.dump
          size=$(stat -c %s "$file")
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "monthly=$([ "$(date -u +%d)" = 01 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Encrypted backup $file ($size bytes)"

      - name: Store daily copy (35 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 35
          compression-level: 0
          if-no-files-found: error

      - name: Store monthly copy (90 days)
        if: steps.dump.outputs.monthly == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
